
# Simulation Input Template

# General Simulation Parameters
time_steps: 720  # Number of time steps for the simulation
time_step_duration: 300  # Duration of each time step in seconds
T_sur: 300 #Surroundings temperature
heat_loss_bool: False

# Input Definitions
heat_inputs:
  - range: [0, 359]
    value: 1e5  # Heat input in Watts for time steps 0 to 49
  - range: [360, 719]
    value: 1  # Heat input in Watts for time steps 0 to 49
flow_rates:
  - range: [0, 359]
    value: 25  # Flow rate in kg/s for all time steps
  - range: [360, 719]
    value: 1
emissivity_tables:
  - range: [0, 359]
    value: 
      - [[0.0, 1.0], 0.001]  # Below 1 micron
      - [[1.0, 10000.0], 0.001]  # Above 1 micron
  - range: [360, 719]
    value: 
      - [[0.0, 1.0], 0.95]  # Below 1 micron
      - [[1.0, 10000.0], 0.1]  # Above 1 micron
storage_bypass_fractions:
  - range: [0, 719]
    value: 0.2  # Fraction of flow rate bypassing the storage block

power_conversion_bypass_fractions:
  - range: [0, 719]
    value: 0.3  # Fraction of flow rate bypassing the power conversion block


# Fluid Initial Conditions
initial_fluids:
  # List of Fluid objects containing the initial conditions at each location
  pump_outlet:
    temperature: 2173  # Temperature in Kelvin
    pressure: 1e6  # Pressure in Pascals
    flow_rate: 0  # Flow rate in kg/s
  heater_inlet:
    temperature: 2173  # Temperature in Kelvin
    pressure: 1e6  # Pressure in Pascals
    flow_rate: 0  # Flow rate in kg/s
  heater_outlet:
    temperature: 2173  # Temperature in Kelvin
    pressure: 1e6  # Pressure in Pascals
    flow_rate: 0  # Flow rate in kg/s
  storage_inlet:
    temperature: 2173  # Temperature in Kelvin
    pressure: 1e6  # Pressure in Pascals
    flow_rate: 0  # Flow rate in kg/s
  storage_outlet:
    temperature: 2173  # Temperature in Kelvin
    pressure: 1e6  # Pressure in Pascals
    flow_rate: 0  # Flow rate in kg/s
  power_conversion_inlet:
    temperature: 2173  # Temperature in Kelvin
    pressure: 1e6  # Pressure in Pascals
    flow_rate: 0  # Flow rate in kg/s
  power_conversion_outlet:
    temperature: 2173  # Temperature in Kelvin
    pressure: 1e6  # Pressure in Pascals
    flow_rate: 0  # Flow rate in kg/s
  pump_inlet:
    temperature: 2173  # Temperature in Kelvin
    pressure: 1e6  # Pressure in Pascals
    flow_rate: 0  # Flow rate in kg/s

# Pump Parameters
pump:
  efficiency: 0.85  # Pump efficiency

# Heater Parameters
heater:
  heat_input: 1e5 # heat input [W]
  N_pipes: 10  # Number of pipes in the heater
  Pipe:
    length: 2.0  # Length of the pipe in meters
    OD: 0.05  # Diameter of the pipe in meters
    wall_thickness: 0.005  # Wall thickness of the pipe in meters
    roughness: 1e-5  # Roughness of the pipe in meters
    th_ins: 0.0 #insulation thickness

# Storage Module Parameters
storage:
  N_pipes: 4  # Number of pipes in the storage module
  Pipe:
    length: 2.0  # Length of the pipe in meters
    OD: 0.05  # Diameter of the pipe in meters
    wall_thickness: 0.005  # Wall thickness of the pipe in meters
    roughness: 1e-5  # Roughness of the pipe in meters
    th_ins: 0.0 #insulation thickness
  num_ax_segments: 12  # Number of axial segments in the storage module
  num_rad_segments: 10  # Number of radial segments in the storage module
  Block:
    initial_temp: 2173  # Initial temperature distribution in the block (example values)
    inner_radius: 0.1  # Inner radius of the block in meters
    outer_radius: 0.481  # Outer radius of the block in meters
    length: 2.0  # Length of the block in meters

# Power Conversion Block Parameters
power_conversion:
  axial_steps: 10  # Number of axial discretization steps
  N_cells: 1  # Number of powerstick/emitter assemblies
  height_pipe: 0.01  # Height of the rectangular pipe in meters
  width_emitter: 0.25  # Width of the emitter in meters
  length: 3.0  # Length of the components in meters
  roughness_pipe: 1e-5  # Roughness of the pipe in meters
  width_powerstick: 0.1  # Width of the power stick in meters
  wall_thickness: 0.01  # Thickness of the graphite wall in meters
  cooling_temp: 313  # Cooling temperature to maintain the power stick in Kelvin
  panel_efficiency: 0.5  # Panel conversion efficiency above bandgap
  emissivity_table:  # List of tuples containing wavelength ranges and corresponding emissivities
    - [[0.0, 1.0], 0.95]
    - [[1.0, 1e4], 0.1]  # Example: [[wavelength range start, wavelength range end], emissivity]

# Pipe Parameters
pipes:
  - length: 3.0  # Length of the pipe in meters
    OD: 0.05  # Diameter of the pipe in meters
    wall_thickness: 0.005  # Wall thickness of the pipe in meters
    roughness: 1e-5  # Roughness of the pipe in meters
    th_ins: 0.25 # insulation thickness
  - length: 3.0  # Length of the pipe in meters
    OD: 0.05  # Diameter of the pipe in meters
    wall_thickness: 0.005  # Wall thickness of the pipe in meters
    roughness: 1e-5  # Roughness of the pipe in meters
    th_ins: 0.25 # insulation thickness
  - length: 3.0  # Length of the pipe in meters
    OD: 0.05  # Diameter of the pipe in meters
    wall_thickness: 0.005  # Wall thickness of the pipe in meters
    roughness: 1e-5  # Roughness of the pipe in meters
    th_ins: 0.25 # insulation thickness
  - length: 3.0  # Length of the pipe in meters
    OD: 0.05  # Diameter of the pipe in meters
    wall_thickness: 0.005  # Wall thickness of the pipe in meters
    roughness: 1e-5  # Roughness of the pipe in meters
    th_ins: 0.25 # insulation thickness
